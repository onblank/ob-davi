name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose native assets should be rebuilt
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        name: Create release automation token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ONBLANK_RELEASE_APP_ID }}
          private-key: ${{ secrets.ONBLANK_RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  native-builds:
    needs: release-please
    if: >-
      ${{
        always() &&
        ((github.event_name == 'push' &&
          needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true') ||
         (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        run: pnpm --filter @obdavi/desktop dist
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ runner.os }}
          path: apps/desktop/dist-installers/*
          if-no-files-found: error

  publish-assets:
    needs: [release-please, native-builds]
    if: >-
      ${{
        always() &&
        needs.native-builds.result == 'success' &&
        ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
         (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create checksums
        run: find artifacts -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: |
          find artifacts -type f -exec gh release upload "$TAG" {} --clobber \;
          gh release upload "$TAG" SHA256SUMS --clobber
